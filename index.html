  <!-- Critical Theme Script & Inline Styles to prevent FOUC -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('ms-theme');
        if (savedTheme === 'cyberpunk') {
          document.documentElement.className = 'cyberpunk-theme';
        } else if (savedTheme === 'light') {
          document.documentElement.className = 'light-theme';
        }
      } catch (e) {}
    })();
  </script>

    :root {

    html, body {

      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    html.light-theme, html.light-theme body {
      background-color: #fafafa;
      color: #0f172a;
      color-scheme: light;
    }
    html.cyberpunk-theme, html.cyberpunk-theme body {

    #root {

    }
    html.cyberpunk-theme #root:empty {

      font-family: 'Outfit';
      font-display: swap;
    }
    @font-face {

      font-display: swap;
    }
